# VtxEffPolyseedMC/analysis/config/vtxeff_MVTX3_z10.cfg: good tracks with >= 3 MVTX clusters (good_nmvtx_min = 3),
# central window zcut_abs = 10 cm. Input list and output are given on the command line (-l, -o).
# =============================================================================
# Vertex-finding efficiency study - configuration
# =============================================================================
# Format: one "key = value" pair per line.
#   - Everything after '#' is a comment.
#   - Keys are case sensitive.
#   - Unknown keys stop the program, so typos cannot silently fall back to a
#     default.
# Read by src/VtxEffAnalysis.cc (see ReadConfig()).
# Command-line options of VtxEffAnalysis override the file list and the
# output file name.
# =============================================================================

# --- Input -------------------------------------------------------------------
# SvtxEvaluator ntuples, one file per Condor job (sim/submit.sh).
# input_dir: directory prepended to RELATIVE names in the list. Default: the evaluator
# files of the 1M reference production (1000 jobs x 1000 events, new.1, MDC2, random
# seeds). READ ONLY - the program refuses to write inside input_dir.
input_dir    = /sphenix/tg/tg01/hf/usman/Corral_Sims/production_1M_trkeff/S1M_new1_mdc2/evaluator
# input_list: plain text list of file names (relative to input_dir) or absolute paths.
# Empty here: always given on the command line (-l); analysis/run_analysis.sh does this.
input_list   =

# --- Output ------------------------------------------------------------------
output_file  = output/VtxEff_validation.root
# Also write the slim per-event TTree "evt"? (1 row per collision)
write_event_tree = 1

# --- "good reconstructed track" selection (baseline n) -----------------------
# A reconstructed track counts toward n if:
#   pt > good_pt_min  AND  |eta| < good_abseta_max  AND  ntpc >= good_ntpc_min
# ntpc = number of TPC clusters on the track's TPC seed (evaluator branch ntpc).
good_pt_min      = 0.1      # GeV/c
good_abseta_max  = 1.1
good_ntpc_min    = 18
# Optional: also require nmaps >= good_nmvtx_min MVTX clusters per good track
# (ntp_track.nmaps). 0 = no MVTX requirement (baseline). Only n changes;
# N and the vertex definition do not depend on it.
good_nmvtx_min   = 3

# --- Generator-level primary charged multiplicity N --------------------------
# N counts G4 primaries (gprimary==1) with nonzero charge and:
#   gpt > true_pt_min AND |geta| < true_abseta_max
# The defaults use the same kinematic window as the reco tracks.
true_pt_min      = 0.1      # GeV/c
true_abseta_max  = 1.1

# --- Histogram ranges ----------------------------------------------------------
# Fine multiplicity histograms use unit-width bins centred on integers
# 0 ... mult_max. Wider variable bins (for high multiplicity) are defined in
# the code and listed in the README.
mult_max         = 100
# True-z range for efficiency-vs-z plots (cm).
ztrue_max        = 40.0
# Central true-z window (cm) for an ADDITIONAL set of epsilon(n), epsilon(N)
# histograms (suffix _zc). The vertex finder has no acceptance beyond
# |z_true| ~ 20 cm (silicon acceptance), so this separates the multiplicity
# dependence from the z acceptance. The all-z baseline is always filled too.
zcut_abs         = 10.0

# --- Test option ---------------------------------------------------------------
# Process only the first N events of every file (0 = all events). For quick
# tests; the -n command-line option overrides it. Keep 0 for production.
max_events_per_file = 0
