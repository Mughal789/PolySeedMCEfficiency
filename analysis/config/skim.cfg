# =============================================================================
# EvalSkim configuration (analysis/src/EvalSkim.cc) - step 1 of the unified
# vertex + single-track efficiency framework.
# Format: key = value; '#' starts a comment; unknown keys are fatal.
# Input list and output directory are normally given on the command line
# (-l LIST -o OUTDIR, see analysis/run_skim.sh).
# =============================================================================

input_dir   =            # prefix for relative names in the list (empty = absolute paths)
input_list  =
output_dir  =

# --- TruthTree retention (NOT analysis cuts; keep this broad) -----------------
# bit 1: charged G4 primaries with gpt >= truth_pt_min AND
#        (|eta| < truth_abseta_max OR |y| < truth_absy_max)
truth_pt_min     = 0.0      # GeV/c (0 = no pT cut)
truth_abseta_max = 1.5
truth_absy_max   = 1.5
# bits 2+4: primary K0S / Lambda / anti-Lambda in the same acceptance and their
#           direct daughters (any kinematics)
keep_v0          = 1
# bit 8: every G4 particle that is the dominant truth particle of >= 1 track
keep_matched     = 1

# --- EventTree summary multiplicities (same definitions as VtxEffAnalysis) ---
# nTrkGood / nGoodMVTX{1,2,3}: tracks with pt > good_pt_min, |eta| < good_abseta_max,
# ntpc >= good_ntpc_min (and nmaps >= 1,2,3). The RecoTree itself is NOT cut.
good_pt_min      = 0.1
good_abseta_max  = 1.1
good_ntpc_min    = 18
# NchPrim and N<species>: charged G4 primaries with gpt > true_pt_min, |eta| < true_abseta_max
true_pt_min      = 0.1
true_abseta_max  = 1.1

# --- Misc ----------------------------------------------------------------------
max_events_per_file = 0     # 0 = all (tests only; -n overrides)
compression         = 505   # ROOT compression setting (505 = ZSTD level 5)
